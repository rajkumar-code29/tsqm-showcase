name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Only the showcase folder is published. shots/ and tools/ stay in the
      # repo but are not served.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: showcase
      - id: deploy
        uses: actions/deploy-pages@v4
